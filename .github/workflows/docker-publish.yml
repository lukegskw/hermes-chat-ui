name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify code quality
        run: pnpm lint && pnpm type-check && pnpm test && pnpm build

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-published-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull the published digest anonymously
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull "$IMAGE_REF"
          docker run -d --name hermes-chat-ui-smoke \
            -e HERMES_API_URL=http://127.0.0.1:1 \
            -e HERMES_API_KEY=ci-smoke-minimum-key \
            "$IMAGE_REF"
          for attempt in $(seq 1 20); do
            if docker exec hermes-chat-ui-smoke node -e \
              "fetch('http://127.0.0.1:8643/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs hermes-chat-ui-smoke
          exit 1
