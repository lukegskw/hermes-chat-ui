# Optional: for a NEW Hermes installation. Existing users keep their own service
# and data mounts; see docs/installation.md before replacing any configuration.
services:
  hermes-agent:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest@sha256:5d8b173e746ab53d0cbad44c1ea4c6d048f2d3a17ff5af1af0ae3033d29cb1b4}
    command: ["gateway", "run"]
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8642}:8642"
      - "127.0.0.1:${DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-./hermes-data}:/opt/data
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${API_SERVER_KEY:?Set API_SERVER_KEY in .env to a strong random value}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # Enable only after configuring dashboard authentication.
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-0}
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      HERMES_CHAT_UI_URL: http://hermes-chat-ui:8643
      HERMES_PUSH_API_KEY: ${HERMES_PUSH_API_KEY:-}
    networks: [hermes-internal]

networks:
  hermes-internal:
    name: ${HERMES_NETWORK:-hermes-internal}
    driver: bridge
