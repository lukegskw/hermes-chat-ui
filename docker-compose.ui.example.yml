services:
  hermes-chat-ui:
    image: ${HERMES_UI_IMAGE:-ghcr.io/lukegskw/hermes-chat-ui:latest}
    restart: unless-stopped
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:${PROXY_PORT:-8643}:8643"
    environment:
      HERMES_API_URL: ${HERMES_API_URL:-http://hermes-agent:8642}
      HERMES_API_KEY: ${API_SERVER_KEY:?Set API_SERVER_KEY in .env to your Hermes API key}
      HERMES_PROXY_PORT: "8643"
      HERMES_UI_DATA_DIR: /app/data
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:push@example.com}
      # Optional: only needed for proactive automation, not chat completion push.
      HERMES_PUSH_API_KEY: ${HERMES_PUSH_API_KEY:-}
      HERMES_DASHBOARD_URL: ${HERMES_DASHBOARD_URL:-}
      HERMES_DASHBOARD_AUTH_PROVIDER: ${HERMES_DASHBOARD_AUTH_PROVIDER:-basic}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
    volumes:
      - ui-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [hermes-internal]

volumes:
  ui-data:

networks:
  hermes-internal:
    external: true
    name: ${HERMES_NETWORK:-hermes-internal}
