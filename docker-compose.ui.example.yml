services:
  hermes-chat-ui:
    build:
      context: .
      args:
        # Keep the STT compatibility package aligned with the tested Hermes release.
        HERMES_STT_PACKAGE: ${HERMES_STT_PACKAGE:-hermes-agent[voice]==0.19.0}
    image: hermes-chat-ui:local
    container_name: hermes-chat-ui
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8643}:8643"
    environment:
      - HERMES_API_URL=http://hermes-agent:${API_SERVER_PORT:-8642}
      - HERMES_API_KEY=${API_SERVER_KEY}
      - HERMES_PROXY_PORT=8643
      - HERMES_UI_DATA_DIR=/app/data
      - HERMES_UI_HERMES_CONFIG=/hermes-config/config.yaml
      - SUBSCRIPTIONS_FILE=/app/data/push_subscriptions.json
      - VAPID_KEYS_FILE=/app/data/vapid_keys.json
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:push@example.com}
      - HERMES_PUSH_API_KEY=${HERMES_PUSH_API_KEY}
      - PROACTIVE_REQUESTS_FILE=/app/data/proactive_requests.json
      - HERMES_DASHBOARD_URL=http://hermes-agent:${HERMES_DASHBOARD_PORT:-9119}
      - HERMES_DASHBOARD_AUTH_PROVIDER=${HERMES_DASHBOARD_AUTH_PROVIDER:-basic}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
    volumes:
      # config.yaml is always read; .env is used only by credentialed STT providers.
      # Neither file is exposed to the browser.
      - /volume2/docker_ssd/hermes/config/config.yaml:/hermes-config/config.yaml:ro
      - /volume2/docker_ssd/hermes/config/.env:/hermes-config/.env:ro
      - /volume2/docker_ssd/hermes-chat-ui/data:/app/data
      - /volume2/docker_ssd/hermes-chat-ui/cache:/app/cache
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [hermes-internal]

# Created by docker-compose.hermes-agent.example.yml.
networks:
  hermes-internal:
    external: true
    name: hermes-internal
